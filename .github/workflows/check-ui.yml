name: Prototype checks
on:
  push:
    branches: [feat/interactive-ui-prototype]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check src/v3.js
          node --check src/v2.js
          node --check src/app.js
          node --check src/data.js
      - name: Validate map fixtures and source contracts
        run: |
          node --input-type=module -e "import('./src/data.js').then(m => { if (m.REGIONS.length !== 16 || m.TILES.length !== 10 || m.TILES.some(x=>x.length!==16)) process.exit(1); console.log('Fixtures OK'); })"
          node --input-type=module -e "import('node:fs').then(fs=>{ const html=fs.readFileSync('index.html','utf8'); if(!html.includes('src/v3.js')||!html.includes('src/v4.css'))process.exit(1); const ui=fs.readFileSync('src/v3.js','utf8'); for(const feature of ['function playerPanel','function drawOverlay','function bottomMenu','STATUS_MOCK','svgIcon','function dungeonMove','quickSave']){ if(!ui.includes(feature))process.exit(1) } console.log('UI module contracts OK')})"
      - name: Check layout regression contracts
        run: |
          node --input-type=module -e "import('node:fs').then(fs=>{let js=fs.readFileSync('src/v3.js','utf8');let css=fs.readFileSync('src/v3.css','utf8');for(let s of ['top-settings','craft-layout','world-v4','인벤토리 종류 필터','제작 목록 정렬'])if(!js.includes(s))process.exit(1);for(let s of ['height:100dvh','height:274px','grid-template-columns:repeat(4,clamp(78px,11dvh,112px))','grid-template-columns:repeat(16,36px)'])if(!css.includes(s))process.exit(1);console.log('UI layout contracts OK')})"
      - name: Check colorful UI source and layout
        run: |
          node --input-type=module -e "import('node:fs').then(fs=>{ const js=fs.readFileSync('src/v3.js','utf8'),css=fs.readFileSync('src/v4.css','utf8'); for(const token of ['inventory-item-button','inventory-layout','dungeon-direction-controls','지하미궁','world-v4'])if(!js.includes(token))process.exit(1); for(const token of ['radial-gradient','122px','font-size:16px','inventory-choice','dungeonlayout'])if(!css.includes(token))process.exit(1); console.log('v0.4 UI checks passed'); })"
